name: CI

# Só Linux: é o sistema do TCEC e o runner mais barato. O Windows é coberto pelo gate local
# (a máquina de desenvolvimento é Windows); o build .exe para a CCRL entra quando houver release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O toolchain e os componentes vêm do rust-toolchain.toml.
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
